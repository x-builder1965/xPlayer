<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xPlayer -メディアプレイヤー-</title>
    <link rel="icon" type="image/x-icon" href="xPlayer.ico">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts の接続用 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Noto Sans JP の 400(Regular) と 900(Black) を読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="video-container">
            <button id="cutCancelBtn" data-tooltip="編集中止（Escape）">❌</button>
			<div id="mediaContainer">
			    <div id="imageWallpaper">
			        <img id="imageWallpaperImg" src="" alt="" />
			    </div>
			    <video id="videoPlayer" src=""></video>
			    <audio id="audioPlayer" preload="metadata"></audio>
			    <div id="imageWrapper">
			        <img id="imagePlayer" src="" alt="" />
			    </div>
			    <div id="visualizerContainer"></div>
			    <div id="darkOverlay"></div>
			</div>
            <video id="videoPreview" src="" muted></video>
            <div id="centerControls" class="center-controls">
                <img id="centerPrevBtn" src="control_prev.png" alt="前へ" class="center-btn center-btn-side" />
                <img id="centerPlayPauseBtn" src="control_play.png" alt="再生/一時停止" class="center-btn center-btn-main" />
                <img id="centerNextBtn" src="control_next.png" alt="次へ" class="center-btn center-btn-side" />
            </div>
            <div id="messageOverlay"></div>
            <div id="iconOverlay" class="icon-overlay"></div>
            <div class="filename">
                <div class="filename-panel">
                    <button id="modeChangeBtn" data-tooltip="視聴モード（Ctrl+v）">🎬</button>
                    <button id="editModeBtn" data-tooltip="編集モード（Ctrl+e）">✂️</button>
                    <button id="joinPlaylistBtn" data-tooltip="結合編集（Ctrl+j）">🎞️</button>
                    <input id="playlistPathArea" type="text" readonly placeholder="再生中メディアパス" data-tooltip="再生中メディアパス">
                    <button id="randomPlayBtn" class="play-mode-btn" data-tooltip="ランダム再生 (Ctrl+r)">🔀</button>
                    <button id="repeatPlayBtn"  class="play-mode-btn" data-tooltip="繰り返し再生 (Ctrl+Shift+r)">🔁</button>
                    <button id="autoShuffleBtn" data-tooltip="自動シャッフル設定（Ctrl+w）">🤖</button>
                </div>
                <div class="url-input-panel">
                    <input id="urlInput" type="text" placeholder="URLを入力" data-tooltip="URLを入力">
                    <button id="urlClearBtn" data-tooltip="URLクリア（Shift+C）">🔘</button>
                    <button id="urlConfirmBtn" data-tooltip="URL再生（Enter）">✅</button>
                </div>
            </div>
            <div id="filterPanel" class="filter-panel">
                <div class="filter-panel-header">
                    <span id="itemCount" data-tooltip="（絞込数/総数）">00,000 / 00,000</span>
                    <div class="filter-container">
                        <input id="playlistFilterInput" type="text" autocomplete="off" placeholder="フィルタ条件（AND:スペース区切り、OR:カンマ区切り）" data-tooltip="プレイリストを絞り込み（例：aaaa bbbb, cccc dddd）">
                        <ul id="filterHistoryList" class="filter-history-dropdown hidden"></ul>
                    </div>
                    <button id="filterClearBtn" data-tooltip="フィルタ条件クリア（Shift+0）">🔘</button>
                    <span class="spacer"></span>
                    <button id="sortPlaylistBtn" data-tooltip="並び替え（Shift+m）">📩</button>
                    <button id="playlistDisplayBtn" data-tooltip="表示形式（Shift+l）">📚</button>
                    <button id="upMovePlaylistBtn" data-tooltip="上へ（Shift+p／Home）">🔼</button>
                    <button id="downMovePlaylistBtn" data-tooltip="下へ（Shift+n／End）">🔽</button>
                    <button id="addPlaylistBtn" data-tooltip="追加（Shift+a）">＋</button>
                    <button id="removePlaylistBtn" data-tooltip="削除（Shift+d）">－</button>
                    <button id="clearPlaylistBtn" data-tooltip="クリア（Shift+c）">🆑</button>
                    <button id="savePlaylistBtn" data-tooltip="保存（Shift+s）">💾</button>
                </div>
                <div id="playlistProgressBar" class="playlist-progress-bar" role="progressbar" aria-label="プレイリスト作成中" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
                <div id="filterList" class="filter-list"></div>
            </div>
            <div id="editPanel" class="edit-panel">
                <div class="edit-header">
                    <button id="setInMarkBtn" data-tooltip="インマークを設定（Shift+i）">📍←</button>
                    <span id="inMarkDisplay">--:--:--</span>
                    <div class="seekbar-group">
                        <input type="range" id="editSeekBar" value="0" min="0" max="100" data-tooltip="カット編集位置">
                        <div id="cutTimelineContainer">
                            <div id="cutTimelineBar"></div>
                        </div>
                    </div>
                    <span id="outMarkDisplay">--:--:--</span>
                    <button id="setOutMarkBtn" data-tooltip="アウトマークを設定（Shift+o）">→📍</button>
                    <button id="addCutRangeBtn" data-tooltip="カット設定を追加（Shift+m）">✅</button>
                    <button id="saveVideoBtn" data-tooltip="設定したカットを適用して保存（Shift+s）">💾</button>
                    <button id="clearEditBtn" data-tooltip="編集を全クリア（Shift+c）">🆑</button>
                </div>
                <div id="cutRangesContainer">
                    <div id="cutRangesList"></div>
                </div>
            </div>
            <div class="controls">
                <div class="control-row">
                    <div class="left-controls">
                        <button id="urlInputBtn" data-tooltip="ネットURL入力（Ctrl+n）">🌐</button>
                        <button id="folderInput" data-tooltip="フォルダ選択（Ctrl+d）">📁</button>
                        <button id="videoInput" data-tooltip="ファイル選択（Ctrl+f）">🗒️</button>
                        <span class="spacer"></span>
                        <button id="prevVideoBtn" data-tooltip="前へ（PgUp）">⏮️</button>
                        <button id="rewindBtn" data-tooltip="30秒戻る（Ctrl+←）">⏪</button>
                        <button id="playPauseBtn" data-tooltip="再生（Space／Right Click）">▶️</button>
                        <button id="playStopBtn" data-tooltip="停止（Ctrl+Space／Ctrl+Right Click）">⏹️</button>
                        <button id="fastForwardBtn" data-tooltip="30秒進む（Ctrl+→）">⏩</button>
                        <button id="nextVideoBtn" data-tooltip="次へ（PgDw）">⏭️</button>
                        <span class="spacer"></span>
                        <button id="settingsBtn" data-tooltip="設定モード開始（Ctrl+q）">⚙️</button>
                        <button id="zoomBtn" data-tooltip="ズームモード開始（Ctrl+z）">🔍</button>
                        <button id="helpOpenBtn" data-tooltip="ヘルプ開く（Ctrl+h）">❔</button>
                    </div>
                    <label class="app-name-and-copyright" id="appNameAndCopyright"></label>
                </div>
                <div class="control-row">
                    <button id="voiceSelectBtn" data-tooltip="音声選択（Ctrl+t）">🎤</button>
                    <button id="subtitleSelectBtn" data-tooltip="字幕選択（Ctrl+t）">🔠</button>
                    <button id="volumeMuteBtn" data-tooltip="ミュート（Ctrl+m）">🔊</button>
                    <span id="volumeDisplay" data-tooltip="音量（↑↓／Swipe Up Down／Wheel）">20%</span>
                    <input type="range" id="volumeBar" value="0.2" min="0" max="1" step="0.01" data-tooltip="音量変更（↑↓／Swipe Up Down）">
                    <select id="speedSelect" data-tooltip="再生速度（Ctrl+.／Ctrl+,）">
                        <option value="0.25">0.25x</option>
                        <option value="0.50">0.50x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1.00" selected>1.00x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.50">1.50x</option>
                        <option value="1.75">1.75x</option>
                        <option value="2.00">2.00x</option>
                        <option value="2.50">2.50x</option>
                        <option value="3.00">3.00x</option>
                        <option value="5.00">5.00x</option>
                    </select>
                    <span id="timeDisplay" data-tooltip="再生時間/総時間（←→／Swipe Left Right）">0:00:00 / 0:00:00</span>
                    <input type="range" id="seekBar" value="0" min="0" max="100" data-tooltip="再生位置変更（←→／Swipe Left Right）">
                </div>
            </div>
            <div id="settingsPanel" class="settings-panel">
                <button id="fullscreenBtn" data-tooltip="フルスクリーン表示（Ctrl+a／Double Click）">🖥️</button>
                <button id="alwaysOnTopBtn" data-tooltip="常に最前面を設定（Ctrl+1）">🔝</button>
                <button id="wallpaperBtn" data-tooltip="背景壁紙（Ctrl+p）">🖼️</button>
                <button id="audioMotionBtn" data-tooltip="オーディオモーション設定（Ctrl+m）">🏳️‍🌈</button>
                <button id="imageEffectBgmBtn" data-tooltip="イメージエフェクト＆BGM設定（Ctrl+b）">💃</button>
                <button id="pauseShowBtn" data-tooltip="コントロール表示抑止（Ctrl+y）">👁️</button>
                <button id="importExportBtn" data-tooltip="設定インポート・エクスポート（Ctrl+i／Ctrl+o）">🍥</button>
                <button id="settingsCloseBtn" data-tooltip="設定モード終了（Ctrl+q）">❌</button>
            </div>
            <div id="zoomPanel">
                <button id="zoomResetBtn" data-tooltip="ズームリセット（Ctrl+0）">🔘</button>
                <button id="aspectRatioBtn" data-tooltip="アスペクト比設定（Ctrl+u）">📺</button>
                <button id="fitModeBtn" data-tooltip="画像を含む（Ctrl+x）">↔️</button>
                <button id="snapshotBtn" data-tooltip="スナップショット（Ctrl+s）">📷</button>
                <input type="range" id="zoomBar" value="0" min="-100" max="500" step="5" data-tooltip="ズーム調整">
                <span id="zoomDisplay">0%</span>
                <button id="zoomEndBtn" data-tooltip="ズームモード終了（Ctrl+z）">❌</button>
            </div>
        </div>
        <div class="help-container">
            <div class="header-row">
                <h1>xPlayer -メディアプレイヤー-</h1>
                <button id="helpCloseBtn" data-tooltip="ヘルプ閉じる（Escape）">❌</button>
            </div>
            <div id="helpTableContainer" class="help-table-container"></div>
            <div id="changelogBtn" class="changelog-toggle">▶ 変更履歴</div>
            <div id="changelogContent" class="changelog-container"></div>
        </div>
    </div>

    <script id="app-config" type="application/json">
    {
        "copyright": "Copyright © 2025- @x-builder, Japan",
        "email": "x-builder@gmail.com",
        "appName": "xPlayer -メディアプレイヤー- Ver6.05.0"
    }
    </script>
    <script src="renderer_declarat.js"></script>
    <script src="renderer_initializ.js"></script>
    <script src="renderer_event.js"></script>
    <script src="renderer_helper.js"></script>
</body>
</html>
